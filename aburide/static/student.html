<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABURide — Telegram Student Bot Simulator</title>
  <style>
    :root {
      --bg: #0e1621;
      --bubble-in: #182533;
      --bubble-out: #2b5278;
      --text: #f5f5f5;
      --subtext: #708499;
      --accent: #2481cc;
      --btn-bg: #2b5278;
      --btn-hover: #3a6d9e;
      --green: #4fae4e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #8bb1cf;
        --bubble-in: #ffffff;
        --bubble-out: #effdde;
        --text: #000000;
        --subtext: #707579;
        --accent: #2481cc;
        --btn-bg: #e1ecf4;
        --btn-hover: #cbe0ef;
        --green: #1b7a1b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
    }
    header {
      background: rgba(24, 37, 51, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .bot-info { display: flex; align-items: center; gap: 10px; }
    .bot-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #2481cc, #1e6399);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold; color: white;
    }
    .bot-details b { font-size: 16px; display: block; }
    .bot-details span { font-size: 12px; color: var(--subtext); }
    .switch-link {
      background: var(--btn-bg);
      color: var(--text);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 84%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
    }
    .msg.bot {
      background: var(--bubble-in);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .msg.user {
      background: var(--bubble-out);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
    .msg .time {
      font-size: 11px;
      color: var(--subtext);
      float: right;
      margin-left: 10px;
      margin-top: 4px;
    }
    .keyboards {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .kb-row {
      display: flex;
      gap: 6px;
    }
    .kb-btn {
      flex: 1;
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .kb-btn:active { background: var(--btn-hover); }
    .kb-btn.confirm { background: #0a6b38; color: #fff; }
    .kb-btn.cancel { background: #b3261e; color: #fff; }
    footer {
      background: rgba(24, 37, 51, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quick-actions {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .pill {
      background: var(--btn-bg);
      color: var(--text);
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-bar {
      display: flex;
      gap: 8px;
    }
    #text-in {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }
    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pin-badge {
      display: inline-block;
      background: #ffc400;
      color: #121612;
      font-family: monospace;
      font-weight: 800;
      font-size: 18px;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 2px;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="bot-info">
      <div class="bot-avatar">🚐</div>
      <div class="bot-details">
        <b>ABURide Bot</b>
        <span>Telegram Mini App & Chat Simulator</span>
      </div>
    </div>
    <a href="/" class="switch-link">Driver View →</a>
  </header>

  <div id="chat">
    <div class="msg bot">
      👋 <b>Welcome to ABURide!</b><br><br>
      This is the live interactive <b>Student Telegram Interface</b>.<br>
      Tap <b>/start</b> below to register or <b>/ride</b> to book a shuttle seat.
      <div class="time">Just now</div>
    </div>
  </div>

  <footer>
    <div class="quick-actions">
      <button class="pill" onclick="send('/start')">/start</button>
      <button class="pill" onclick="send('/ride')">/ride</button>
      <button class="pill" onclick="send('/cancel')">/cancel</button>
      <button class="pill" onclick="send('/balance')">/balance</button>
      <button class="pill" onclick="send('/help')">/help</button>
    </div>
    <div class="input-bar">
      <input type="text" id="text-in" placeholder="Type a message or command..." onkeydown="if(event.key==='Enter')sendText()">
      <button id="send-btn" onclick="sendText()">➤</button>
    </div>
  </footer>

  <script>
    const TG_ID = 555888;
    const STUDENT_NAME = "Zainab (Student)";
    let knownNotifs = new Set();

    function nowStr() {
      const d = new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMsg(text, type, keyboards = null) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${type}`;

      let content = text.replace(/\n/g, '<br>');
      content = content.replace(/\*([^*]+)\*/g, '<b>$1</b>');
      content = content.replace(/`([^`]+)`/g, '<span class="pin-badge">$1</span>');

      div.innerHTML = content + `<div class="time">${nowStr()}</div>`;

      if (keyboards && keyboards.length) {
        const kbContainer = document.createElement('div');
        kbContainer.className = 'keyboards';
        keyboards.forEach(row => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'kb-row';
          row.forEach(btn => {
            const b = document.createElement('button');
            b.className = 'kb-btn';
            if (btn.text.includes('Confirm')) b.classList.add('confirm');
            if (btn.text.includes('Cancel')) b.classList.add('cancel');
            b.textContent = btn.text;
            b.onclick = () => {
              // Disable keyboard on click
              kbContainer.style.opacity = '0.5';
              kbContainer.style.pointerEvents = 'none';
              callback(btn.data, btn.text);
            };
            rowDiv.appendChild(b);
          });
          kbContainer.appendChild(rowDiv);
        });
        div.appendChild(kbContainer);
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send(text) {
      addMsg(text, 'user');
      try {
        const res = await fetch('/api/bot/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: TG_ID, text: text, name: STUDENT_NAME })
        });
        const data = await res.json();
        addMsg(data.text, 'bot', data.keyboards);
      } catch (e) {
        addMsg('⚠️ Error communicating with bot server.', 'bot');
      }
    }

    async function callback(data, label) {
      addMsg(label, 'user');
      try {
        const res = await fetch('/api/bot/callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: TG_ID, data: data })
        });
        const resp = await res.json();
        addMsg(resp.text, 'bot', resp.keyboards);
      } catch (e) {
        addMsg('⚠️ Error handling selection.', 'bot');
      }
    }

    function sendText() {
      const input = document.getElementById('text-in');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      send(val);
    }

    // Auto-poll notifications (e.g. driver arrival alerts)
    async function checkNotifications() {
      try {
        const res = await fetch(`/api/bot/notifications?telegram_id=${TG_ID}`);
        if (res.ok) {
          const notes = await res.json();
          notes.forEach(n => {
            if (!knownNotifs.has(n.id)) {
              knownNotifs.add(n.id);
              addMsg(n.text, 'bot');
            }
          });
        }
      } catch (e) {}
    }

    setInterval(checkNotifications, 3000);
    // Start with /start on load
    setTimeout(() => send('/start'), 400);
  </script>
</body>
</html>
